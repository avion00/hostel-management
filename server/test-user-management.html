<!DOCTYPE html>
<html>
<head>
    <title>Test User Management API</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 200px; }
        pre { background: #f4f4f4; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>User Management API Test</h1>
    
    <div class="section">
        <h2>1. Login</h2>
        <input type="email" id="email" placeholder="Email" value="admin@hostel.com">
        <input type="password" id="password" placeholder="Password" value="admin123">
        <button onclick="login()">Login</button>
        <div id="loginResult"></div>
    </div>

    <div class="section">
        <h2>2. Test Endpoints</h2>
        <button onclick="testUserStats()">Test User Stats</button>
        <button onclick="testUsersList()">Test Users List</button>
        <button onclick="testCreateUser()">Test Create User</button>
        <div id="testResult"></div>
    </div>

    <script>
        let token = '';
        const API_URL = 'http://localhost:5000/api';

        async function login() {
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    token = data.data.accessToken;
                    document.getElementById('loginResult').innerHTML = 
                        '<p class="success">✅ Login successful! Token saved.</p>';
                } else {
                    document.getElementById('loginResult').innerHTML = 
                        '<p class="error">❌ Login failed: ' + data.message + '</p>';
                }
            } catch (error) {
                document.getElementById('loginResult').innerHTML = 
                    '<p class="error">❌ Error: ' + error.message + '</p>';
            }
        }

        async function testUserStats() {
            if (!token) {
                alert('Please login first');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/admin/users/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                document.getElementById('testResult').innerHTML = 
                    `<h3>User Stats Response (${response.status}):</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('testResult').innerHTML = 
                    '<p class="error">❌ Error: ' + error.message + '</p>';
            }
        }

        async function testUsersList() {
            if (!token) {
                alert('Please login first');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/admin/users?page=1&limit=10`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                document.getElementById('testResult').innerHTML = 
                    `<h3>Users List Response (${response.status}):</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('testResult').innerHTML = 
                    '<p class="error">❌ Error: ' + error.message + '</p>';
            }
        }

        async function testCreateUser() {
            if (!token) {
                alert('Please login first');
                return;
            }

            const testUser = {
                name: 'Test User ' + Date.now(),
                email: 'test' + Date.now() + '@example.com',
                password: 'password123',
                phone: '9876543210',
                role: 'student',
                is_active: true
            };

            try {
                const response = await fetch(`${API_URL}/admin/users`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testUser)
                });
                
                const data = await response.json();
                document.getElementById('testResult').innerHTML = 
                    `<h3>Create User Response (${response.status}):</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('testResult').innerHTML = 
                    '<p class="error">❌ Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
