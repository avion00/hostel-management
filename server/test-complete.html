<!DOCTYPE html>
<html>
<head>
    <title>Complete System Test</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: blue; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:hover { background: #0056b3; }
        input, select { padding: 8px; margin: 5px; width: 200px; }
        pre { background: #f4f4f4; padding: 10px; overflow: auto; border-radius: 5px; }
        .form-group { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Complete Hostel Management System Test</h1>
    
    <div class="test-section">
        <h2>Step 1: Login</h2>
        <div class="form-group">
            <input type="email" id="email" placeholder="Email" value="admin@hostel.com">
            <input type="password" id="password" placeholder="Password" value="admin123">
            <button onclick="login()">Login as Admin</button>
        </div>
        <div id="loginResult"></div>
    </div>

    <div class="test-section">
        <h2>Step 2: Test User Management</h2>
        <button onclick="testUserList()">List Users</button>
        <button onclick="createTestManager()">Create Test Manager</button>
        <div id="userResult"></div>
    </div>

    <div class="test-section">
        <h2>Step 3: Test Property Creation</h2>
        <div class="form-group">
            <input type="text" id="propertyName" placeholder="Property Name" value="Test Hostel">
            <select id="managerId">
                <option value="">Select Manager (will be populated)</option>
            </select>
            <input type="file" id="propertyImage" accept="image/*">
            <button onclick="createProperty()">Create Property</button>
        </div>
        <div id="propertyResult"></div>
    </div>

    <script>
        let token = '';
        let managers = [];
        const API_URL = 'http://localhost:5000/api';

        async function login() {
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    token = data.data.accessToken;
                    document.getElementById('loginResult').innerHTML = 
                        '<p class="success">✅ Login successful!</p>';
                    
                    // Load managers after login
                    loadManagers();
                } else {
                    document.getElementById('loginResult').innerHTML = 
                        '<p class="error">❌ Login failed: ' + data.message + '</p>';
                }
            } catch (error) {
                document.getElementById('loginResult').innerHTML = 
                    '<p class="error">❌ Error: ' + error.message + '</p>';
            }
        }

        async function loadManagers() {
            try {
                const response = await fetch(`${API_URL}/admin/users?role=manager`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                if (data.success && data.data) {
                    managers = data.data;
                    const select = document.getElementById('managerId');
                    select.innerHTML = '<option value="">Select Manager</option>';
                    managers.forEach(manager => {
                        select.innerHTML += `<option value="${manager.id}">${manager.name} (${manager.email})</option>`;
                    });
                }
            } catch (error) {
                console.error('Error loading managers:', error);
            }
        }

        async function testUserList() {
            if (!token) {
                alert('Please login first');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/admin/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                document.getElementById('userResult').innerHTML = 
                    `<h3>Users List (${response.status}):</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('userResult').innerHTML = 
                    '<p class="error">❌ Error: ' + error.message + '</p>';
            }
        }

        async function createTestManager() {
            if (!token) {
                alert('Please login first');
                return;
            }

            const testManager = {
                name: 'Test Manager ' + Date.now(),
                email: 'manager' + Date.now() + '@test.com',
                password: 'password123',
                phone: '9876543210',
                role: 'manager',
                is_active: true
            };

            try {
                const response = await fetch(`${API_URL}/admin/users`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testManager)
                });
                
                const data = await response.json();
                document.getElementById('userResult').innerHTML = 
                    `<h3>Create Manager Response (${response.status}):</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
                
                if (data.success) {
                    // Reload managers
                    loadManagers();
                }
            } catch (error) {
                document.getElementById('userResult').innerHTML = 
                    '<p class="error">❌ Error: ' + error.message + '</p>';
            }
        }

        async function createProperty() {
            if (!token) {
                alert('Please login first');
                return;
            }

            const managerId = document.getElementById('managerId').value;
            if (!managerId) {
                alert('Please select a manager');
                return;
            }

            const formData = new FormData();
            formData.append('manager_id', managerId);
            formData.append('name', document.getElementById('propertyName').value);
            formData.append('description', 'Test property created via API');
            formData.append('address', '123 Test Street');
            formData.append('city', 'Test City');
            formData.append('state', 'Test State');
            formData.append('pincode', '12345');
            formData.append('total_rooms', '10');
            formData.append('price_starting', '5000');
            formData.append('amenities', JSON.stringify(['WiFi', 'AC', 'Parking']));
            
            const fileInput = document.getElementById('propertyImage');
            if (fileInput.files.length > 0) {
                formData.append('images', fileInput.files[0]);
            }

            try {
                const response = await fetch(`${API_URL}/admin/hostels`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                const data = await response.json();
                document.getElementById('propertyResult').innerHTML = 
                    `<h3>Create Property Response (${response.status}):</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('propertyResult').innerHTML = 
                    '<p class="error">❌ Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
